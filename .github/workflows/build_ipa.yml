name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip libiPhone-lib.a
        run: |
          if [ -f "Libraries/libiPhone-lib.a.zip" ]; then
            echo "Unzipping Libraries/libiPhone-lib.a.zip..."
            unzip -o Libraries/libiPhone-lib.a.zip -d Libraries/
          fi
          ls -la Libraries/

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SuperFingerSoccer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/SuperFingerSoccer.xcarchive/Products/Applications/SuperFingerSoccer.app Payload/
          zip -r SuperFingerSoccer.ipa Payload
          ls -lh SuperFingerSoccer.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperFingerSoccer-IPA
          path: SuperFingerSoccer.ipa
